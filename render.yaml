services:
  - type: web
    name: motion-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: CAMERA_SOURCE
        value: phone
      - key: ACCESS_PASSWORD
        generateValue: true
